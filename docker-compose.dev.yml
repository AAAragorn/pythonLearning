version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: python-app-dev
    ports:
      - "5000:5000"
    environment:
      - DEBUG=True
      - PORT=5000
      - FLASK_ENV=development
    volumes:
      - .:/app
      - /app/__pycache__
    command: python run.py
    stdin_open: true
    tty: true
